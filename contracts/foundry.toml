[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = false
# remappings temporarily disabled for deployment
# remappings = [
#     "@verifier/=../circuits/solidity-verifier/",
# ]

# For tests, disable optimizer to avoid stack-too-deep in UltraHonkVerifier
[profile.test]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = false
remappings = [
    "@verifier/=../circuits/solidity-verifier/",
]

# Deployment profile: use via-ir for optimizer stack safety (for Mintmarks)
[profile.deploy]
src = "src"
test = "none"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# Empty remappings to avoid compiling UltraHonkVerifier
remappings = []

# Verifier deployment profile: optimizer ON with low runs to reduce size
[profile.deploy-verifier]
src = "../circuits/solidity-verifier"
test = "none"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 10
remappings = [
    "@verifier/=../circuits/solidity-verifier/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BLOCKSCOUT_API_KEY}", url = "https://base-sepolia.blockscout.com/api/", chain = 84532 }
sepolia = { key = "${BLOCKSCOUT_API_KEY}", url = "https://eth-sepolia.blockscout.com/api/", chain = 11155111 }
